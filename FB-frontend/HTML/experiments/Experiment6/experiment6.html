<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>
    <style>
        body {
            font-family: Arial;
            background: #eef2ff;
            text-align: center;
            padding: 40px;
        }
        #todo-container {
            width: 350px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        ul {
            padding: 0;
        }
        li {
            list-style: none;
            background: #c7d2fe;
            margin: 8px 0;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
        }
        button {
            background: #ef4444;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #dc2626;
        }
    </style>
</head>
<body>

<div id="todo-container">
    <h2>To-Do List</h2>

    <input id="taskInput" type="text" placeholder="Enter task..." />
    <button onclick="addTask()">Add</button>

    <ul id="taskList"></ul>
</div>

<script>

function addTask() {
    const input = document.getElementById("taskInput");
    let text = input.value.trim();

    if (text === "") {
        alert("Enter a task!");
        return;
    }

    // Create <li>
    const li = document.createElement("li");
    
    // Create text node
    li.appendChild(document.createTextNode(text));

    
    const delBtn = document.createElement("button");
    delBtn.textContent = "Delete";

    // Delete on click
    delBtn.onclick = function() {
        li.remove();
    };

    li.appendChild(delBtn);

    document.getElementById("taskList").appendChild(li);

    input.value = "";
}

</script>

</body>
</html>
