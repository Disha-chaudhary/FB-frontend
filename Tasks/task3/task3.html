<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Carousel</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 30px;
        }

        #carousel {
            width: 400px;
            height: 250px;
            margin: auto;
            border: 2px solid black;
        }

        #carousel img {
            width: 100%;
            height: 100%;
        }

        button {
            padding: 8px 16px;
            margin: 10px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <h2>Simple Image Carousel</h2>

    <div id="carousel">
        <img id="slide" src="img1.jpg" alt="carousel image">
    </div>

    <br>
    <button onclick="prevImage()">Previous</button>
    <button onclick="nextImage()">Next</button>

    <script>
        // ---- IMAGE LIST ----
        let images = [
            "",
            "img2.jpg",
            "img3.jpg",
            "img4.jpg",
            "img5.jpg"
        ];

        let index = 0;
        let slideImg = document.getElementById("slide");
        let carousel = document.getElementById("carousel");

       
        function showImage() {
            slideImg.src = images[index];
        }

      
        function nextImage() {
            index++;
            if (index >= images.length) {
                index = 0;
            }
            showImage();
        }

        
        function prevImage() {
            index--;
            if (index < 0) {
                index = images.length - 1;
            }
            showImage();
        }

        let autoSlide = setInterval(nextImage, 3000);

       
        carousel.addEventListener("mouseenter", function () {
            clearInterval(autoSlide);
        });

        carousel.addEventListener("mouseleave", function () {
            autoSlide = setInterval(nextImage, 3000);
        });
    </script>

</body>
</html>
