<!DOCTYPE html>
<html>
<head>
    <title>Product Filter</title>
    <style>
        body {
            background: linear-gradient(to bottom, #cc0066 0%, #666699 100%);
            font-family: Arial;
            padding: 20px;
           
        }
        .btn {
            padding: 8px 15px;
            margin: 5px;
            height:50px;
           width:100px;

            cursor: pointer;
            border: none;
            background: #a6b8ce;
            color: white;
        }
        .btn:hover {
            background: #98bd9a;
            scale:1.2;
            font-size: large;
            transition: 0.3s;
        }
        #searchBox {
            padding: 8px;
            width: 300px;
            margin: 10px 0;
        }
        li {
            margin: 5px 0;

        }
        .list{
            background-color: rgb(223, 196, 196);
            padding: 20px;
            border-radius: 10px;
            width: 350px;
        }
    </style>
</head>

<body>
    <div style="text-align: center;"> 

    <h1>Interactive Product Filter</h1>

    <!-- BUTTONS -->
    <button class="btn" onclick="filterProducts('all')">All</button>
    <button class="btn" onclick="filterProducts('electronics')">Electronics</button>
    <button class="btn" onclick="filterProducts('clothing')">Clothing</button>

    <br><br>

    <!-- BONUS SEARCH BOX -->
    <input type="text" id="searchBox" placeholder="Search products..." onkeyup="searchProduct()">

   <div class="list"> <!-- PRODUCT LIST -->
    <ul id="productList"></ul></div>



    <script>
        // List of products
        var products = [
            { name: "Laptop", category: "electronics" },
            { name: "Smartphone", category: "electronics" },
            { name: "Headphones", category: "electronics" },
            { name: "T-shirt", category: "clothing" },
            { name: "Jeans", category: "clothing" },
            { name: "Sneakers", category: "clothing" },
            { name: "Wrist Watch", category: "electronics" },
            { name: "Jacket", category: "clothing" },
            { name: "Bluetooth Speaker", category: "electronics" },
            { name: "Cap", category: "clothing" }
        ];

        var productList = document.getElementById("productList");

        // Display all products on load
        display(products);

        // Function to show products on screen
        function display(items) {
            productList.innerHTML = "";
            items.forEach(function (item) {
                var li = document.createElement("li");
                li.textContent = item.name + " (" + item.category + ")";
                productList.appendChild(li);
            });
        }

        // Filter by category
        function filterProducts(cat) {
            if (cat === "all") {
                display(products);
            } else {
                var filtered = products.filter(function (p) {
                    return p.category === cat;
                });
                display(filtered);
            }
        }

        // Search filter (Bonus)
        function searchProduct() {
            var keyword = document.getElementById("searchBox").value.toLowerCase();

            var filtered = products.filter(function (p) {
                return p.name.toLowerCase().includes(keyword);
            });

            display(filtered);
        }
    </script>
    </div>

</body>
</html>
